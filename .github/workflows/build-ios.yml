name: Build iOS IPA (Sổ Ơi)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build SoOi Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive (Release for iOS Device)
        run: |
          cd ios_app
          xcodebuild -project SoOi.xcodeproj \
            -scheme SoOi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/SoOi.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd ios_app
          mkdir -p Payload
          cp -r build/SoOi.xcarchive/Products/Applications/SoOi.app Payload/
          zip -r SoOi.ipa Payload
          rm -rf Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoOi-iOS-IPA
          path: ios_app/SoOi.ipa
          retention-days: 14
